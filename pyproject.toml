[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nids-egraphsage-research"
version = "0.1.0"
description = "Reproducible full-data E-GraphSAGE experiments for NF-UQ-NIDS-v2"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
