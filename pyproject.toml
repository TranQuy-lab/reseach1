[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nids-preprocessing"
version = "0.1.0"
description = "Preprocessing pipeline for NF-UQ-NIDS-v2 (Person A's stage), verified against the reference NF-UQ-NIDS-V2-00-Cleaning notebook"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
